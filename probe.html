<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanka Time — probe</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101410">
<style>
  /* Deliberately plain. This page exists to answer one question — what
     does this phone actually report — and anything decorative here would
     be one more thing that could be lying. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* background lives on html alone, so the restore script in <head> can
     set it before the first paint — body doesn't exist yet up there */
  html { background: #101410; }
  html, body { height: 100%; color: #9be9a8;
               font: 14px/1.5 ui-monospace, Menlo, monospace; }
  /* The app locks the document and scrolls an inner room instead. So does
     this, under the same toggle — otherwise "lock scrolling" just clips
     the page and puts the buttons out of reach, which is not the thing
     being tested. */
  .room { padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom); }
  html.locked .room { position: fixed; inset: 0; overflow-y: auto;
                      overscroll-behavior-y: none; }
  h1 { font-size: 14px; font-weight: 700; margin: 1rem 0 .5rem; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: .15rem 0; vertical-align: top; }
  td:first-child { color: #3d5c46; padding-right: .75rem; white-space: nowrap; }
  b { color: #4ade80; }
  input { width: 100%; margin-top: 1rem; padding: .6rem; font: inherit;
          background: #0a0c0a; color: inherit; border: 1px solid #3d5c46; }
  /* the two bands the app draws, so their real height is visible here */
  button { font: inherit; padding: .55rem .5rem; margin: .25rem .25rem 0 0;
           background: #0a0c0a; color: inherit; border: 1px solid #3d5c46; }
  button.on { border-color: #4ade80; color: #4ade80; }
  .tall { height: 260vh; }              /* something for the document to scroll */
  html.locked, html.locked body { height: 100%; overflow: hidden; }
  /* the app's faded edges: one fixed layer over the whole viewport. If
     Safari is sampling pixels rather than reading the meta, this is the
     thing standing in front of what it would sample. */
  .veil { position: fixed; inset: 0; pointer-events: none; display: none; }
  html.veiled .veil { display: block; }
  .top, .bot { position: fixed; left: 0; right: 0; background: #e0525233; }
  .top { top: 0; height: calc(env(safe-area-inset-top) + 3.4rem); }
  .bot { bottom: 0; height: calc(.5rem + env(safe-area-inset-bottom) * .5 + 3.4rem); }
</style>
<script>
/* The state of the experiment survives a reload, and is restored here in
   <head> so it is in place before the first paint. That matters: "reload
   and the tint is right" is the one case known to work, and it is only a
   fair comparison if the reload starts on the colour you cycled to
   rather than resetting to the one written in the file. */
window.TC = { colours: ['#101410', '#f6f1e3', '#171321'], at: 0,
              how: 'mut', locked: false, veiled: false, manifest: false };
try { Object.assign(window.TC, JSON.parse(localStorage.tcProbe || '{}')); } catch (e) {}
(function () {
  const hex = TC.colours[TC.at];
  document.documentElement.style.background = hex;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (TC.how === 'non') meta.remove(); else meta.content = hex;
  if (TC.locked) document.documentElement.classList.add('locked');
  if (TC.veiled) document.documentElement.classList.add('veiled');
  /* The app links a web app manifest, and that manifest declares a
     theme_color of its own. A manifest is only ever read at load, so this
     one is linked from here rather than offered as a live toggle. Its
     theme_color is a red that appears in none of the cycle colours, so
     there is no mistaking which source the browser is listening to. */
  if (TC.manifest) {
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'probe.webmanifest';
    document.head.appendChild(link);
  }
})();
</script>
</head>
<body>
<div class="veil"></div>
<div class="top"></div><div class="bot"></div>
<div class="room">

<h1>is the latest release actually live here?</h1>
<table id="ver"></table>
<div><button id="recheck">check again</button></div>

<h1>does the browser follow the page colour?</h1>
<p style="color:#3d5c46">Pick how the colour is announced, set the conditions,
then cycle and watch Safari's own top and bottom bars.</p>
<div>
  <button id="mut" class="on">rewrite content</button>
  <button id="rep">replace element</button>
  <button id="non">no meta at all</button>
</div>
<div>
  <button id="lock">lock scrolling</button>
  <button id="veil">fixed full-screen layer</button>
</div>
<div>
  <button id="man">manifest, theme_color red (reloads)</button>
</div>
<div>
  <button id="go">cycle the colour</button>
  <button id="reload">reload</button>
</div>
<table id="tc"></table>

<h1>what this phone reports</h1>
<table id="out"></table>
<input id="k" placeholder="tap here to raise the keyboard">
<div class="tall"></div>
</div>
<script>
/* Which release is live, and which one this device is actually running.
 *
 * Most merges don't change anything you could point at from across the
 * room, so "did it ship?" is otherwise a guess. Two numbers answer it,
 * and they can disagree — which is the interesting case:
 *
 *   on the server   the CACHE name in sw.js, read past every cache. This
 *                   is what the deploy put there.
 *   on this device  the cache the service worker has actually installed.
 *                   A new worker only takes over once it has downloaded
 *                   the whole release, so until it does, this phone is
 *                   still running the old one however many times you pull
 *                   to refresh.
 *
 * Worth knowing while reading this page: sw.js caches every GET it
 * serves, not only the files it precaches, so probe.html itself is held
 * until the next CACHE bump. If the stamp below doesn't match the
 * release, this page is stale too and the rest of it may be lying.
 */
const PROBE_BUILD = 'v51';

async function serverRelease() {
  // no-store to get past both the HTTP cache and the service worker
  const res = await fetch('sw.js', { cache: 'no-store' });
  const m = (await res.text()).match(/tanka-time-(v\d+)/);
  return m ? m[1] : '(not found)';
}

async function deviceRelease() {
  if (!window.caches) return '(no cache API)';
  const names = (await caches.keys()).filter(n => n.startsWith('tanka-time-'));
  if (!names.length) return '(app never opened here)';
  return names.map(n => n.replace('tanka-time-', '')).join(' + ');
}

async function drawVer() {
  const el = document.getElementById('ver');
  el.innerHTML = '<tr><td>reading…</td><td></td></tr>';
  let server, device;
  try { server = await serverRelease(); } catch (e) { server = '(offline?)'; }
  try { device = await deviceRelease(); } catch (e) { device = '(error)'; }
  const live = server === device;
  el.innerHTML =
    `<tr><td>on the server</td><td><b>${server}</b></td></tr>` +
    `<tr><td>on this device</td><td><b>${device}</b></td></tr>` +
    `<tr><td>this probe built for</td><td><b>${PROBE_BUILD}</b></td></tr>` +
    `<tr><td>verdict</td><td><b>${
      device.startsWith('(') ? 'nothing installed here yet'
      : live ? 'live — you are testing the latest'
      : 'NOT live yet — open the app, then come back'
    }</b></td></tr>`;
}
document.getElementById('recheck').onclick = drawVer;
drawVer();

const rows = [
  ['screen', () => `${screen.width} x ${screen.height} css px`],
  ['devicePixelRatio', () => devicePixelRatio],
  ['innerHeight (layout)', () => innerHeight],
  ['visualViewport.height', () => visualViewport ? Math.round(visualViewport.height) : '—'],
  ['visualViewport.offsetTop', () => visualViewport ? Math.round(visualViewport.offsetTop) : '—'],
  ['keyboard gap', () => visualViewport
      ? Math.round(innerHeight - visualViewport.height - visualViewport.offsetTop) : '—'],
  ['safe-area top', () => px('--sa-top')],
  ['safe-area bottom', () => px('--sa-bot')],
  ['half of bottom', () => px('--sa-half')],
  ['--foot would be', () => px('--sa-foot')],
  // navigator.standalone is the one iOS answers honestly: a page added to
  // the home screen with the apple- meta tags runs full-screen without
  // necessarily matching the display-mode query, which had this reporting
  // "no" from inside the installed app and sent a diagnosis the wrong way
  ['standalone?', () => (navigator.standalone ? 'yes (navigator)' : 'no') +
     (matchMedia('(display-mode: standalone)').matches ? ' + display-mode' : '')],
  ['pointer coarse?', () => matchMedia('(pointer: coarse)').matches ? 'yes' : 'no'],
];
// read the env() values by letting the browser compute them for us
const probe = document.createElement('div');
probe.style.cssText = 'position:absolute;visibility:hidden;' +
  '--sa-top:env(safe-area-inset-top);--sa-bot:env(safe-area-inset-bottom);' +
  '--sa-half:calc(env(safe-area-inset-bottom) * .5);' +
  '--sa-foot:calc(.5rem + env(safe-area-inset-bottom) * .5);' +
  'top:var(--sa-top);left:var(--sa-bot)';
document.body.appendChild(probe);
function px(name) {
  // custom properties come back as written, so resolve through a real
  // property the browser has to compute
  probe.style.height = `var(${name})`;
  const v = getComputedStyle(probe).height;
  return v === 'auto' ? '(unsupported)' : v;
}
function draw() {
  document.getElementById('out').innerHTML = rows
    .map(([k, f]) => { let v; try { v = f(); } catch (e) { v = 'error'; }
                       return `<tr><td>${k}</td><td><b>${v}</b></td></tr>`; })
    .join('');
}

/* The experiment.
 *
 * Safari tints its top and bottom bars to match the page. The app cycles
 * themes without a reload and the tint stopped following — it holds
 * whatever colour the page loaded on. Rewriting the meta's content was
 * how the app had always done it and it used to work; replacing the
 * element outright didn't help either. So the variable is probably not
 * how the colour is *announced* but what else changed around it, and
 * this page varies all of it independently:
 *
 *   how       rewrite the meta's content · replace the element · no meta
 *             at all, leaving Safari to sample the page's own colour
 *   locked    the document cannot scroll, which is what stopped the
 *             toolbar wandering under the keyboard and is the app's
 *             single biggest structural change
 *   veiled    a fixed layer across the whole viewport, which is how the
 *             faded edges are drawn — and which stands exactly where
 *             anything sampling pixels would be looking
 *
 * Reload is the control: it is known to pick up the right colour.
 */
const root = document.documentElement;
function tcMeta() { return document.querySelector('meta[name="theme-color"]'); }
function save() { try { localStorage.tcProbe = JSON.stringify(TC); } catch (e) {} }

function paint(hex) {
  root.style.background = hex;
  // the veil carries the colour too, the way the app's edges fade to --bg
  document.querySelector('.veil').style.background =
    `linear-gradient(${hex} 0, transparent 12%, transparent 88%, ${hex} 100%)`;
}

function announce(hex) {
  const meta = tcMeta();
  if (TC.how === 'non') { if (meta) meta.remove(); return; }
  if (TC.how === 'rep' || !meta) {
    const m = document.createElement('meta');
    m.setAttribute('name', 'theme-color');
    m.setAttribute('content', hex);
    if (meta) meta.replaceWith(m); else document.head.appendChild(m);
    return;
  }
  meta.content = hex;
}

function cycle() {
  TC.at = (TC.at + 1) % TC.colours.length;
  const hex = TC.colours[TC.at];
  paint(hex);
  announce(hex);
  save();
  drawTc();
}

const HOW = { mut: 'rewrite content', rep: 'replace element', non: 'no meta at all' };
function drawTc() {
  for (const k of Object.keys(HOW))
    document.getElementById(k).classList.toggle('on', TC.how === k);
  document.getElementById('lock').classList.toggle('on', TC.locked);
  document.getElementById('veil').classList.toggle('on', TC.veiled);
  document.getElementById('man').classList.toggle('on', TC.manifest);
  const meta = tcMeta();
  document.getElementById('tc').innerHTML =
    `<tr><td>page colour</td><td><b>${TC.colours[TC.at]}</b></td></tr>` +
    `<tr><td>meta says</td><td><b>${meta ? meta.content : '(no meta)'}</b></td></tr>` +
    `<tr><td>announced by</td><td><b>${HOW[TC.how]}</b></td></tr>` +
    `<tr><td>document scrolls</td><td><b>${TC.locked ? 'no (like the app)' : 'yes'}</b></td></tr>` +
    `<tr><td>fixed layer over it</td><td><b>${TC.veiled ? 'yes (like the app)' : 'no'}</b></td></tr>` +
    `<tr><td>manifest linked</td><td><b>${
      TC.manifest ? 'yes, theme_color #e05252' : 'no'}</b></td></tr>`;
}

for (const k of Object.keys(HOW))
  document.getElementById(k).onclick = () => {
    TC.how = k;
    announce(TC.colours[TC.at]);
    save(); drawTc();
  };
for (const [id, key, cls] of [['lock', 'locked', 'locked'], ['veil', 'veiled', 'veiled']])
  document.getElementById(id).onclick = () => {
    TC[key] = !TC[key];
    root.classList.toggle(cls, TC[key]);
    save(); drawTc();
  };
// a manifest is only read at load, so this one has to take the page with it
document.getElementById('man').onclick = () => {
  TC.manifest = !TC.manifest;
  save();
  location.reload();
};
document.getElementById('go').onclick = cycle;
document.getElementById('reload').onclick = () => { save(); location.reload(); };

paint(TC.colours[TC.at]);
drawTc();

draw();
addEventListener('resize', draw);
visualViewport?.addEventListener('resize', draw);
visualViewport?.addEventListener('scroll', draw);
setInterval(draw, 500);
</script>
</body>
</html>
